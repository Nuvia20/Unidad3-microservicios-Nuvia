spring.application.name=MS-A
server.port=8081

# AuthServer publica las claves y el issuer usados para validar los JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

# Base de datos H2 local en archivo para conservar los datos entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/msa_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka local debe estar encendido antes que MS-A.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Evita búsquedas JPA durante la serialización de respuestas.
spring.jpa.open-in-view=false
