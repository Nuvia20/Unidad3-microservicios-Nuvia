server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-server
              uri: lb://AUTH-SERVER
              predicates:
                - Path=/oauth2/**

            - id: MS-A
              uri: lb://MS-A
              predicates:
                - Path=/api/ENTITYA/**

            - id: MS-B
              uri: lb://MS-B
              predicates:
                - Path=/api/ENTITYB/**
